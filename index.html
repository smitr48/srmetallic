<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SR Metallic | Coming Soon</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #111827, #1f2937, #374151);
      color: #ffffff;
      text-align: center;
    }

    .container {
      width: 90%;
      max-width: 700px;
      padding: 50px 30px;
    }

    .logo {
      font-size: 42px;
      font-weight: 800;
      letter-spacing: 3px;
      margin-bottom: 25px;
    }

    .logo span {
      color: #d1d5db;
    }

    .badge {
      display: inline-block;
      padding: 8px 18px;
      border: 1px solid #9ca3af;
      border-radius: 30px;
      font-size: 14px;
      letter-spacing: 1px;
      margin-bottom: 25px;
      color: #e5e7eb;
    }

    h1 {
      font-size: 48px;
      margin-bottom: 20px;
      line-height: 1.2;
    }

    p {
      font-size: 18px;
      line-height: 1.7;
      color: #d1d5db;
      margin-bottom: 30px;
    }

    .loader {
      width: 55px;
      height: 55px;
      border: 4px solid rgba(255,255,255,0.2);
      border-top: 4px solid #ffffff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 30px;
    }

    @keyframes spin {
      100% {
        transform: rotate(360deg);
      }
    }

    .footer {
      margin-top: 40px;
      font-size: 13px;
      color: #9ca3af;
    }

    @media (max-width: 600px) {
      .logo {
        font-size: 32px;
      }

      h1 {
        font-size: 36px;
      }

      p {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">
      SR <span>METALLIC</span>
    </div>

    <div class="badge">
      WEBSITE UNDER DEVELOPMENT
    </div>

    <div class="loader"></div>

    <h1>We’re Building Something Great</h1>

    <p>
      Our new website is currently under development.
      We’re working hard to bring you a better experience.
      Please check back soon.
    </p>

    <div class="footer">
      © 2026 SR Metallic. All Rights Reserved.
    </div>

  </div>

</body>
</html>
